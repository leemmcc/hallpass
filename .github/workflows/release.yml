name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.HALLPASS_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hallpass.jks"

      - name: Build signed APK
        env:
          HALLPASS_KEYSTORE_PATH: ${{ runner.temp }}/hallpass.jks
          HALLPASS_KEYSTORE_PASSWORD: ${{ secrets.HALLPASS_KEYSTORE_PASSWORD }}
          HALLPASS_KEY_ALIAS: ${{ secrets.HALLPASS_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
