name: Bootstrap keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          # Alphanumeric only: this password round-trips through a file, a
          # GitHub secret and a Gradle env var, and punctuation invites
          # quoting bugs somewhere along that path.
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore hallpass.jks \
            -alias hallpass \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Hall Pass, OU=Home, O=Home, C=US"
          base64 -w0 hallpass.jks > keystore.b64
          # printf, not echo: a trailing newline becomes part of the secret and
          # every later build fails with "keystore password was incorrect".
          printf '%s' "$PASS" > keystore.pass

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: |
            keystore.b64
            keystore.pass
          retention-days: 1
